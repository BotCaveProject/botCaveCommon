name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x] # tester plusieurs versions

    steps:
      # 1. Checkout repo
      - uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # 3. Install pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      # 4. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Build all packages
      - name: Build packages
        run: pnpm run build

      # 6. (Optionnel) Lint
      - name: Lint
        run: pnpm run lint --if-present

      # 7. (Optionnel) Tests
      - name: Run tests
        run: pnpm test --if-present
