name: Package Monorepo TypeScript Libraries with pnpm

on:
  release:
    types: [created]

jobs:
  build-and-pack:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Install pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      # 4. Install dependencies
      - name: Install dependencies
        run: pnpm install

      # 5. Compile all packages
      - name: Build all packages
        run: pnpm -r build

      # 6. Pack each package individually
      - name: Pack all packages
        run: |
          mkdir -p dist/archives
          for pkg in packages/*; do
            if [ -f "$pkg/package.json" ]; then
              echo "Packing $(basename $pkg)..."
              cd "$pkg"
              pnpm pack --pack-destination ../../dist/archives
              cd ../..
            fi
          done

      # 7. List archives
      - name: List generated archives
        run: ls -lh dist/archives

      # 8. Upload all archives as release assets
      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: dist/archives/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}