name: Release Archives

on:
  release:
    types: [created]

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - uses: actions/checkout@v4

      # 2. Setup Node + pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      # 3. Install deps
      - run: pnpm install --frozen-lockfile

      # 4. Build all packages
      - run: pnpm run build

      # 5. Pack each package
      - name: Pack packages
        run: |
          mkdir -p dist/archives
          for pkg in $(ls packages); do
            echo "Packing $pkg..."
            cd packages/$pkg
            pnpm pack --pack-destination ../../dist/archives
            cd ../..
          done

      # 6. List archives
      - run: ls -lh dist/archives

      # 7. Upload archives as release assets
      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: dist/archives/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

